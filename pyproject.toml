[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slothops"
version = "0.1.0"
description = "The slow, steady, and utterly chill local AI agent for automated workspace de-cluttering and guilt-free daily wind-downs."
readme = "README.md"
authors = [{ name = "Mohit Deshwal" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "python-multipart>=0.0.9"
]

[project.scripts]
slothops = "slothops.cli:cli"
